# Mosquitto для docker-стенда MajorDoMo.
# Только отладка: анонимный доступ, без TLS. Наружу порт не публикуется,
# брокер доступен только сервисам compose по имени mosquitto.

listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type all
connection_messages true
