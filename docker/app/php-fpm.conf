; Пул PHP-FPM для docker-стенда.
; Официальный образ уже содержит www.conf с listen=9000; здесь только то, что
; нужно для отладки: вывод в docker logs и достаточно процессов для AJAX.

[www]
catch_workers_output = yes
decorate_workers_output = no
clear_env = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Долгие операции (импорт, отчёты, ИИ) не должны обрываться на 30 секундах.
request_terminate_timeout = 600s

access.log = /proc/self/fd/2
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d %{kilo}M %C%%"
