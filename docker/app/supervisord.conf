; Управление процессами docker-стенда MajorDoMo.
; Только отладка: nginx, php-fpm и супервизор циклов в одном контейнере.
; cycle.php сам запускает дочерние циклы, поэтому отдельные программы для них
; не нужны — supervisor следит только за супервизором.

[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid
childlogdir = /var/log/supervisor

[program:php-fpm]
command = /usr/local/sbin/php-fpm --nodaemonize
directory = /var/www/html
autostart = true
autorestart = true
startsecs = 3
startretries = 100
priority = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command = /usr/sbin/nginx -g "daemon off;"
directory = /var/www/html
autostart = true
autorestart = true
startsecs = 3
startretries = 100
priority = 20
stopwaitsecs = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:cycles]
command = /usr/local/bin/php /var/www/html/cycle.php
directory = /var/www/html
user = www-data
autostart = true
autorestart = true
startsecs = 10
startretries = 100
stopwaitsecs = 30
stopsignal = TERM
; cycle.php запускает дочерние циклы; при остановке контейнера сигнал должен
; уйти всей группе, иначе Workerman и MQTT-воркеры останутся сиротами.
stopasgroup = true
killasgroup = true
priority = 30
environment = HOME="/var/www",USER="www-data",PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
