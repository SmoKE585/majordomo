# nginx для docker-стенда MajorDoMo.
# Отличия от production-примера docs/deploy/nginx.conf.sample:
#   * один контейнер: PHP-FPM на 127.0.0.1:9000, WebSocket на 127.0.0.1:8001;
#   * только HTTP :80, без TLS и внешнего reverse proxy;
#   * X-Forwarded-For всегда равен адресу клиента, чтобы нельзя было подделать
#     «локальный» запрос к API;
#   * логи идут в stdout/stderr контейнера.

server {
    listen 80 default_server;
    server_name _;

    charset utf-8;
    root /var/www/html/public;
    index index.php;
    autoindex off;
    absolute_redirect off;
    server_tokens off;
    client_max_body_size 512m;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Проверка только nginx. Полная проверка PHP/БД — /panel/ в healthcheck.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Публичный путь WebSocket. Внутренний Workerman слушает только loopback.
    location = /ws {
        proxy_pass http://127.0.0.1:8001/majordomo;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
        proxy_cache off;
        access_log off;
    }

    location = /install { return 302 /install.php; }
    location = /install/ { return 302 /install.php; }
    location = /panel { return 301 /panel/; }
    location ^~ /panel/ {
        try_files $uri $uri/ /nf.php?$query_string;
    }

    # /api/... и legacy /api.php/... идут в api.php с исходным REQUEST_URI.
    location ~ ^/api(?:\.php)?(?:/|$) {
        include /etc/nginx/fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root/api.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param SCRIPT_NAME /api.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTP_X_API_KEY $http_x_api_key;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_pass_request_headers on;
        fastcgi_intercept_errors off;
        fastcgi_next_upstream off;
        fastcgi_cache off;
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;
        client_max_body_size 1m;
        error_page 413 = @majordomo_api_body_too_large;
    }

    location @majordomo_api_body_too_large {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Request-ID $request_id always;
        return 413 '{"ok":false,"error":{"code":"payload_too_large","message":"Request body exceeds 1 MiB","details":{}},"meta":{"request_id":"$request_id","generated_by":"nginx"}}';
    }

    error_page 404 /404.php;

    location ^~ /assets/ {
        location ~* (?:/\.|\.(?:php[0-9]*|phtml|phar|ini|sql|log|sh|py|bak)$) { return 404; }
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    location ~ ^/(css|js|img)/(.+)$ {
        return 301 /assets/$1/$2$is_args$args;
    }
    location ~ ^/templates/([a-z0-9_-]+)/(.+\.(?:css|js))$ {
        return 301 /assets/modules/$1/$2$is_args$args;
    }
    location ~ ^/public/(.*)$ { return 301 /$1$is_args$args; }
    location = /rc { return 301 /panel/; }
    location ^~ /rc/ { return 301 /panel/; }

    # Служебные каталоги не публикуются ни для LAN, ни извне.
    location ~ ^/(scripts|objects|3rdparty|packages|vendor)(/|$) {
        return 404;
    }
    location ~ ^/(lib|resources|templates|tests|tools|backup|var|node_modules|languages|src|docker)(/|$) {
        return 404;
    }
    location ~ ^/(config\.php|bootstrap\.php|load_settings\.php|cycle\.php|dev_server\.php|majordomo|composer\.(json|lock)|package(-lock)?\.json|pnpm-lock\.yaml|docker-compose\.ya?ml)(/|$) {
        return 404;
    }
    location = /debmes.txt { return 404; }
    location ~ /\. { return 404; }
    location ~* \.(htaccess|htpasswd|ini|phps|fla|sql|log|sh|py|bak)$ { return 404; }

    # Рабочие PHP-входы установленных модулей.
    location ^~ /modules/ {
        root /var/www/html;
        location ~ /\. { return 404; }
        location ~* \.(htaccess|htpasswd|ini|phps|sql|log|sh|py|bak)$ { return 404; }
        location ~* [^/]\.php(/|$) {
            fastcgi_split_path_info ^(.+?\.php)(/.*)$;
            set $md_path_info $fastcgi_path_info;
            try_files $fastcgi_script_name =404;
            include /etc/nginx/fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_param PATH_INFO $md_path_info;
            fastcgi_param HTTPS $https if_not_empty;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param HTTP_X_API_KEY $http_x_api_key;
            fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
            fastcgi_read_timeout 600s;
            fastcgi_send_timeout 600s;
        }
        try_files $uri $uri/ =404;
    }

    # Из cms публикуются только медиа, без PHP и runtime-данных.
    location ^~ /cms/ {
        root /var/www/html;
        deny all;
        location ~ ^/cms/(cached|debmes|modules_installed|saverestore|cycles|deploy|sessions)/ { deny all; }
        location ~ /\. { deny all; }
        location ~* \.(gif|jpe?g|png|svg|webp|ico|ogg|mp3|wav|mp4|webm|pdf|woff2?|ttf|otf)$ {
            allow all;
            try_files $uri =404;
            expires 7d;
        }
    }

    location ^~ /docs/ {
        root /var/www/html;
        deny all;
        location ~ /\. { deny all; }
        location ~* \.(md|txt|pdf|gif|jpe?g|png|svg|webp|ico)$ {
            allow all;
            default_type text/plain;
            try_files $uri =404;
        }
    }

    location ~* ^/module/app_mediabrowser\..*$ {
        try_files $uri $uri/ /nf.php?$query_string;
    }
    location ~* \.(html|xml)$ {
        try_files $uri $uri/ /nf.php?$query_string;
    }

    location ~* [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        set $md_path_info $fastcgi_path_info;
        try_files $fastcgi_script_name =404;
        include /etc/nginx/fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param PATH_INFO $md_path_info;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTP_X_API_KEY $http_x_api_key;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
