; PHP для docker-стенда MajorDoMo.
; Значения рассчитаны на отладку и загрузку больших дампов/архивов, не на
; минимальное потребление памяти production-сервера.

memory_limit = 512M
upload_max_filesize = 512M
post_max_size = 512M
max_execution_time = 600
max_input_time = 600
max_input_vars = 10000

; Отладочная конфигурация: ошибки видны в docker logs, но не в HTML.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
html_errors = Off

date.timezone = UTC
default_charset = "UTF-8"

session.save_handler = files
session.save_path = /var/www/html/var/sessions
session.gc_maxlifetime = 86400
session.cookie_httponly = 1
session.use_strict_mode = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 120

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; В отладке код меняется часто: OPcache должен замечать правки.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Composer/CLI-скрипты в контейнере не должны упираться в лимит памяти.
; (Для FPM действует memory_limit выше.)
