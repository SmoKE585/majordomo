[#if OBJECT_FIELD#]
<span id="linked_object_replace[#UNIQ#]" class="md-linkedobject-stash" data-md-linkedobject-stash>
    <div class="md-linkedobject"
         data-md-linkedobject
         data-md-linkedobject-role="object"
         data-md-linkedobject-uniq="[#UNIQ#]"
         data-md-linkedobject-field-id="[#OBJECT_FIELD#]"
         data-md-linkedobject-value="[#OBJECT_VALUE#]"
         data-md-linkedobject-base-url="[#BASE_URL#]"
         data-md-linkedobject-label="[#OBJECT_LABEL#]"
         data-md-linkedobject-placeholder="Начните вводить имя"
         data-md-linkedobject-empty="Объекты не найдены"
         data-md-linkedobject-search-placeholder="Поиск объекта"
         data-md-linkedobject-width="[#WIDTH#]"
         style="--md-linkedobject-width:[#WIDTH#];"
         hidden>
        <div class="md-linkedobject__head">
            <label class="md-field__label md-linkedobject__label"
                   data-md-linkedobject-label-node
                   for="[#OBJECT_FIELD#]">[#OBJECT_LABEL#]</label>
            <span class="md-badge md-badge--outline md-linkedobject__badge" data-md-linkedobject-badge hidden></span>
        </div>
        <div class="md-linkedobject__control">
            <div class="md-input-shell md-linkedobject__shell">
                <span class="md-input-icon md-linkedobject__icon" aria-hidden="true"><i class="ti ti-link"></i></span>
                <span class="md-linkedobject__slot" data-md-linkedobject-input-slot></span>
                <button type="button" class="md-input-action md-linkedobject__inline-action" data-md-linkedobject-action="clear" title="Очистить выбор" aria-label="Очистить выбор" hidden><i class="ti ti-x"></i></button>
                <button type="button" class="md-input-action md-linkedobject__inline-action" data-md-linkedobject-action="toggle" title="Показать список" aria-label="Показать список" tabindex="-1"><i class="ti ti-chevron-down"></i></button>
            </div>
        </div>
        <div class="md-linkedobject__foot">
            <div class="md-field__hint md-linkedobject__hint" data-md-linkedobject-hint id="md-linkedobject-hint-[#UNIQ#]-object"></div>
            <div class="md-linkedobject__actions" aria-label="Действия со связью">
                <a class="md-icon-btn md-icon-btn--sm md-linkedobject__action" data-md-linkedobject-action="open-object" href="#" title="Открыть объект" aria-label="Открыть объект" target="_blank" rel="noopener noreferrer" hidden><i class="ti ti-external-link"></i></a>
                <a class="md-icon-btn md-icon-btn--sm md-linkedobject__action" data-md-linkedobject-action="open-properties" href="#" title="Свойства объекта" aria-label="Свойства объекта" target="_blank" rel="noopener noreferrer" hidden><i class="ti ti-list-details"></i></a>
                <a class="md-icon-btn md-icon-btn--sm md-linkedobject__action" data-md-linkedobject-action="open-methods" href="#" title="Методы объекта" aria-label="Методы объекта" target="_blank" rel="noopener noreferrer" hidden><i class="ti ti-bolt"></i></a>
                <a class="md-icon-btn md-icon-btn--sm md-linkedobject__action" data-md-linkedobject-action="open-device" href="#" title="Открыть устройство" aria-label="Открыть устройство" target="_blank" rel="noopener noreferrer" hidden><i class="ti ti-cpu"></i></a>
                <button type="button" class="md-icon-btn md-icon-btn--sm md-linkedobject__action" data-md-linkedobject-action="refresh" title="Обновить список" aria-label="Обновить список"><i class="ti ti-refresh"></i></button>
            </div>
        </div>
        <div class="md-visually-hidden" data-md-linkedobject-status role="status" aria-live="polite"></div>
        [#if OBJECTS_JSON#]
        <script type="application/json" data-md-linkedobject-data="objects">[#OBJECTS_JSON#]</script>
        [#endif#]
    </div>
</span>
[#endif#]
