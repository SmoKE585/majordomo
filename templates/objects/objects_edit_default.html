<section class="md-admin-section-card md-admin-form-card md-object-edit-card">
    <div class="md-admin-section-card__body">
        [#if OK#]
        <div class="alert alert-success"><#LANG_DATA_SAVED#></div>
        [#endif OK#]
        [#if ERR#]
        <div class="alert alert-danger"><#LANG_FILLOUT_REQURED#></div>
        [#endif ERR#]

        <form action="?" method="post" enctype="multipart/form-data" name="frmEdit" class="md-admin-form-grid">
            <div class="row g-3 align-items-start">
                <label class="col-lg-3 col-form-label" for="objectTitle"><#LANG_TITLE#> <span class="text-danger">*</span></label>
                <div class="col-lg-9">
                    <input type="text" id="objectTitle" class="form-control [#if ERR_TITLE#]is-invalid[#endif#]" name="title" value="[#TITLE#]" required>
                </div>
            </div>

            <div class="row g-3 align-items-start">
                <label class="col-lg-3 col-form-label" for="objectClass"><#LANG_CLASS#> <span class="text-danger">*</span></label>
                <div class="col-lg-9">
                    <select name="class_id" id="objectClass" class="form-control form-select [#if ERR_CLASS_ID#]is-invalid[#endif#]" required>
                        <option value="">select</option>
                        [#begin CLASS_ID_OPTIONS#]
                        <option value="[#ID#]"[#if ID="<#CLASS_ID#>"#] selected[#endif#]>[#TITLE#]</option>
                        [#end CLASS_ID_OPTIONS#]
                    </select>
                </div>
            </div>

            <div class="row g-3 align-items-start">
                <label class="col-lg-3 col-form-label" for="objectDescription"><#LANG_DESCRIPTION#></label>
                <div class="col-lg-9">
                    <textarea name="description" id="objectDescription" rows="4" class="form-control md-admin-textarea">[#DESCRIPTION#]</textarea>
                </div>
            </div>

            <div class="row g-3 align-items-start">
                <label class="col-lg-3 col-form-label" for="objectLocation"><#LANG_LOCATION#></label>
                <div class="col-lg-9">
                    <select name="location_id" id="objectLocation" class="form-control form-select">
                        <option value="">-</option>
                        [#begin LOCATION_ID_OPTIONS#]
                        <option value="[#ID#]"[#if SELECTED#] selected[#endif#]>[#TITLE#]</option>
                        [#end LOCATION_ID_OPTIONS#]
                    </select>
                </div>
            </div>

            <div class="md-admin-form-actions">
                [#if ID!=""#]
                <button class="btn btn-primary" type="submit" name="subm"><#LANG_SUBMIT#></button>
                [#else ID#]
                <button class="btn btn-primary" type="submit" name="subm"><#LANG_ADD#></button>
                [#endif ID#]
                <div class="btn-group">
                    <button type="button" class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false"><#LANG_ACTIONS#></button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="?data_source=<#DATA_SOURCE#>"><#LANG_CANCEL#></a></li>
                        [#if ID!=""#]
                        <li><a class="dropdown-item" href="?id=<#ID#>&view_mode=clone" data-md-confirm="<#LANG_ARE_YOU_SURE#>"><#LANG_MAKE_COPY#></a></li>
                        [#endif#]
                    </ul>
                </div>
            </div>

            <input type="hidden" name="id" value="<#ID#>">
            <input type="hidden" name="view_mode" value="<#VIEW_MODE#>">
            <input type="hidden" name="edit_mode" value="<#EDIT_MODE#>">
            <input type="hidden" name="mode" value="update">
            <input type="hidden" name="tab" value="<#TAB#>">
        </form>
    </div>
</section>
