<div class="md-scripts-card">
 <div class="md-scripts-toolbar">
  <div class="md-scripts-section-title"><#LANG_CATEGORIES#></div>
  <div class="md-scripts-toolbar__actions">
   <a href="?view_mode=edit_scripts" class="btn btn-primary">+ <#LANG_ADD_NEW_SCRIPT#></a>
   <a href="?view_mode=edit_categories&data_source=categories" class="btn btn-default">+ <#LANG_ADD_NEW_CATEGORY#></a>
  </div>
 </div>

 [#if RESULT#]
  <form action="?" method="post" name="frmList_scripts" class="md-admin-module-list__form">
   <div class="md-admin-record-list">
    [#begin RESULT#]
     <article class="md-admin-record-card md-scripts-record md-scripts-category-record">
      <div class="md-admin-record-card__main">
       <span class="md-scripts-category-record__icon">#</span>
       <div class="md-admin-record-card__content">
        <div class="md-admin-record-card__title"><strong>[#TITLE#]</strong></div>
       </div>
      </div>
      <div class="md-scripts-record__meta"></div>
      <div class="md-admin-record-card__actions">
       [#if "<#ACTION#>"=="admin"#]
        <a href="?view_mode=edit_categories&id=[#ID#]&data_source=<#DATA_SOURCE#>" title="<#LANG_EDIT#>" class="btn btn-primary btn-sm"><#LANG_EDIT#></a>
        <a href="?view_mode=delete_categories&id=[#ID#]&data_source=<#DATA_SOURCE#>" title="<#LANG_DELETE#>" class="btn btn-danger btn-sm" data-scripts-confirm="<#LANG_ARE_YOU_SURE#>"><#LANG_DELETE#></a>
       [#endif ACTION#]
      </div>
     </article>
    [#end RESULT#]
   </div>
   <input type="hidden" name="data_source" value="<#DATA_SOURCE#>">
   <input type="hidden" name="view_mode" value="multiple_scripts">
  </form>
 [#else RESULT#]
  <div class="md-scripts-empty"><#LANG_NO_RECORDS_FOUND#></div>
 [#endif RESULT#]
</div>
